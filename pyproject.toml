[project]
name = "focus-tracker"
version = "0.1.0"
description = "AI Focus Tracker: personalized, explainable focus-state classification (GP055)"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9",
  "pynput>=1.7",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
ml = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45",
      "matplotlib>=3.8"]

[project.scripts]
focus-logger = "focus_tracker.logger.agent:main"
focus-session = "focus_tracker.logger.session:main"
focus-label = "focus_tracker.logger.labels:main"
focus-app = "focus_tracker.api.app:main"
focus-evaluate = "focus_tracker.models.evaluate:main"
focus-train = "focus_tracker.models.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
